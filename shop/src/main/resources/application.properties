spring.application.name=shop
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.default-schema=online-shop
spring.jpa.properties.hibernate.default_schema=online-shop
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

jwt.private-key=classpath:certs/private.pem
jwt.public-key=classpath:certs/public.pem

shop.locationstrategy=abundant
#shop.locationstrategy=single

tasks.end-of-day.cron=0 59 23 * * *
shop.revenue.enabled=true
tasks.end-of-day.timezone=